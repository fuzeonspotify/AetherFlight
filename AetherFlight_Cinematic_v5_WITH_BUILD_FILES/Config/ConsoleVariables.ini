; Aether Flight baseline. Per-quality overrides live in DefaultScalability.ini.
; These avoid the low-fidelity fast paths that are especially visible at altitude.
r.ScreenPercentage=100
r.Tonemapper.Sharpen=0.25
r.MaxAnisotropy=16
r.ContactShadows=1
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0
r.VolumetricRenderTarget.Mode=0
r.VolumetricCloud.HighQualityAerialPerspective=1
r.VolumetricFog.InjectShadowedLightsSeparately=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Shadow.Virtual.Enable=1
; ProceduralMeshComponent terrain cannot use Nanite. Excluding non-Nanite
; geometry from VSM coarse pages prevents the open-world marking queue overflow
; while preserving detailed nearby virtual shadows.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
